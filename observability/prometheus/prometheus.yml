# Prometheus para el entorno de observabilidad local (docker-compose.observability.yml).
# En producción se usa el servicio de métricas que elija la universidad apuntando a /actuator/prometheus
# con un token de servicio (el endpoint exige rol ADMIN).
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: retencion-backend
    metrics_path: /actuator/prometheus
    authorization:
      credentials_file: /etc/prometheus/token
    static_configs:
      - targets: ["host.docker.internal:8080"]
