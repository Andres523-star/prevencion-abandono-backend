# CI: build + pruebas (Testcontainers con Docker del runner), escaneo de vulnerabilidades,
# escaneo de secretos y build/escaneo de la imagen Docker.
# Asistido por IA (Claude, Anthropic). Ver BITACORA_IA.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: ./mvnw verify (unitarias, integración con Testcontainers, ArchUnit/Modulith, cobertura)
        run: ./mvnw -B verify
      - name: Reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/spring-modulith-docs/
          retention-days: 14

  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose

  dependencies:
    name: Vulnerabilidades (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy (dependencias, secretos y configuración)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  image:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t retencion-backend:${{ github.sha }} .
      - name: Trivy (imagen)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: retencion-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
