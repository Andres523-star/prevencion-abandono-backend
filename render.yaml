# =====================================================================================
# Blueprint de Render (Infraestructura como código). En Render: New → Blueprint → este repo.
# Crea: PostgreSQL 16 gestionado, Key Value (compatible con Redis) y el backend en Docker.
# Los secretos criptográficos se generan en Render (generateValue) y los de Supabase se
# cargan a mano en el panel (sync: false). Nada sensible queda en el repositorio.
# Asistido por IA (Claude, Anthropic). Ver BITACORA_IA.md.
# =====================================================================================

databases:
  - name: retencion-db
    plan: basic-1gb
    region: virginia
    databaseName: retencion
    user: retencion_owner
    postgresMajorVersion: "16"
    # Sin acceso desde Internet: solo la red privada de Render.
    ipAllowList: []

services:
  - type: keyvalue
    name: retencion-redis
    plan: starter
    region: virginia
    # El rate limit y los estados de login no deben desalojarse por memoria.
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: retencion-backend
    runtime: docker
    plan: standard
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health/readiness
    # El despliegue lo dispara el workflow de CD (deploy hook), no cada push.
    autoDeployTrigger: "off"
    # Migraciones controladas antes de cambiar el tráfico: si fallan, el despliegue se cancela.
    preDeployCommand: java -cp "/app/BOOT-INF/classes:/app/BOOT-INF/lib/*" co.edu.retencion.common.ops.MigrateMain
    # Una instancia mientras el tiempo real use el broker simple en memoria. Para escalar a varias,
    # configurar RabbitMQ con rabbitmq_stomp y APP_REALTIME_BROKER=relay (ver docs/dimensionamiento.md).
    numInstances: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # --- Base de datos (red privada)
      - key: DB_HOST
        fromDatabase:
          name: retencion-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: retencion-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: retencion-db
          property: database
      - key: DB_APP_USER
        fromDatabase:
          name: retencion-db
          property: user
      - key: DB_APP_PASSWORD
        fromDatabase:
          name: retencion-db
          property: password
      - key: DB_POOL_MAX
        value: "15"
      # La app solo valida el esquema al arrancar; migra el preDeployCommand.
      - key: APP_FLYWAY_MIGRATE_ON_STARTUP
        value: "false"
      # --- Estado compartido entre instancias
      - key: APP_STATE_BACKEND
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: retencion-redis
          property: connectionString
      # --- Secretos generados por Render (256 bits en Base64). NO regenerar: se perderían los datos cifrados.
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_CRYPTO_MASTER_KEY
        generateValue: true
      - key: APP_CRYPTO_BLIND_INDEX_KEY
        generateValue: true
      # --- Configuración que se completa en el panel de Render
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: APP_BOOTSTRAP_ADMIN_EMAILS
        sync: false
      - key: APP_DEFAULT_ROLES_BY_DOMAIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: APP_REQUIRE_VERIFIED_EMAIL
        value: "true"
      - key: OPENAPI_ENABLED
        value: "false"
      # --- Evidencias (Fase 3): almacenamiento S3 compatible (Supabase Storage, Cloudflare R2...)
      - key: APP_STORAGE_TYPE
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # --- Antivirus: servicio privado ClamAV de este Blueprint
      - key: APP_ANTIVIRUS_MODE
        value: clamav
      - key: CLAMAV_HOST
        fromService:
          type: pserv
          name: retencion-clamav
          property: host
      - key: CLAMAV_PORT
        value: "3310"
      # --- Correo de avisos de faltas (resend o graph)
      - key: APP_MAIL_PROVIDER
        sync: false
      - key: APP_MAIL_FROM
        sync: false
      - key: APP_PORTAL_URL
        sync: false
      - key: APP_MAIL_RESEND_API_KEY
        sync: false
      - key: APP_MAIL_WEBHOOK_SECRET
        generateValue: true
      # --- RabbitMQ no está disponible como servicio gestionado en Render: eventos solo internos
      - key: APP_RABBIT_ENABLED
        value: "false"
      # --- Tiempo real (STOMP). Con una sola instancia basta el broker simple; con varias instancias
      #     hace falta un RabbitMQ externo con rabbitmq_stomp y APP_REALTIME_BROKER=relay.
      - key: APP_REALTIME_BROKER
        value: simple
      - key: APP_REALTIME_SEND_PER_MINUTE
        value: "60"
      # --- IA (Claude). Sin clave, el motor de riesgo funciona solo con reglas.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL_DEFAULT
        value: claude-opus-5-5
      - key: AI_MODEL_TRIAGE
        value: claude-haiku-5-5

  # ClamAV para escanear evidencias antes de que queden disponibles. Requiere ~2 GB de RAM
  # (firmas en memoria); solo accesible desde la red privada del Blueprint.
  - type: pserv
    name: retencion-clamav
    runtime: image
    image:
      url: docker.io/clamav/clamav:1.4
    plan: standard
    region: virginia

