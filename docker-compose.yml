# =====================================================================================
# Entorno de desarrollo local. Uso:
#   cp .env.example .env   (y completa los valores; ver comentarios en el archivo)
#   docker compose up -d                  -> solo infraestructura
#   docker compose --profile app up -d    -> infraestructura + backend en contenedor
# Ningún secreto vive en este archivo: todo sale de .env.
# Asistido por IA (Claude, Anthropic). Ver BITACORA_IA.md.
# =====================================================================================
name: retencion

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-retencion}
      POSTGRES_USER: ${DB_MIGRATION_USER:-retencion_owner}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:?Define DB_MIGRATION_PASSWORD en .env}
      # Rol de la aplicación (privilegios mínimos), lo crea el script de init.
      APP_DB_USER: ${DB_APP_USER:-retencion_app}
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:?Define DB_APP_PASSWORD en .env}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  rabbitmq:
    # Plugin STOMP habilitado para el broker relay de WebSocket (Fase 5).
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-retencion}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:61613:61613"
      - "127.0.0.1:15672:15672"
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  minio:
    # Evidencias y adjuntos (Fases 3 y 5). En producción: almacenamiento de objetos en la misma región.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-retencion}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 10

  clamav:
    # Antivirus para archivos subidos (Fases 3 y 5). Tarda unos minutos en bajar firmas la primera vez.
    image: clamav/clamav:1.4
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamdata:/var/lib/clamav

  app:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  miniodata:
  clamdata:
