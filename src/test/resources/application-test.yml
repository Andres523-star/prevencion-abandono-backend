# Perfil de pruebas. Base de datos, IdP y secretos se inyectan dinámicamente
# (TestDatabase, FakeEntraIdp, TestSecrets); aquí solo hay valores no sensibles.
app:
  security:
    cors:
      allowed-origins: https://app.universidad.edu.co
  rate-limit:
    per-ip:
      capacity: 100000
    per-user:
      capacity: 100000
    sensitive:
      capacity: 100000
  state:
    backend: memory
  users:
    default-roles: estudiantes.universidad.edu.co=ESTUDIANTE
  auth:
    # Sin lista de dominios: se acepta cualquier correo verificado.
    allowed-email-domains: ""
    break-glass:
      enabled: true
  audit:
    partition-months-ahead: 1
  storage:
    type: local
  antivirus:
    mode: signature
  mail:
    provider: memory
    # Los tests despachan explícitamente con MailDispatcher.dispatch().
    dispatch-enabled: false
    webhook-secret: test-webhook-secret
    portal-url: https://portal.universidad.edu.co
  justifications:
    # El reintento de escaneo se invoca explícitamente en los tests.
    rescan-interval-ms: 86400000

logging:
  level:
    root: WARN
    co.edu.retencion: INFO
