# Perfil de pruebas. Base de datos, IdP y secretos se inyectan dinámicamente
# (TestDatabase, FakeEntraIdp, TestSecrets); aquí solo hay valores no sensibles.
app:
  security:
    cors:
      allowed-origins: https://app.universidad.edu.co
  rate-limit:
    per-ip:
      capacity: 100000
    per-user:
      capacity: 100000
    sensitive:
      capacity: 100000
  state:
    backend: memory
  users:
    default-roles: estudiantes.universidad.edu.co=ESTUDIANTE
  auth:
    # Sin lista de dominios: se acepta cualquier correo verificado.
    allowed-email-domains: ""
    break-glass:
      enabled: true
  audit:
    partition-months-ahead: 1
  storage:
    type: local
  antivirus:
    mode: signature
  mail:
    provider: memory
    # Los tests despachan explícitamente con MailDispatcher.dispatch().
    dispatch-enabled: false
    webhook-secret: test-webhook-secret
    portal-url: https://portal.universidad.edu.co
  justifications:
    # El reintento de escaneo se invoca explícitamente en los tests.
    rescan-interval-ms: 86400000

  risk:
    # Las pruebas procesan la cola y el lote explícitamente (RiskWorker.drain, RiskBatchLauncher.run).
    worker-enabled: false
    batch:
      enabled: false

# Claude simulado con WireMock (FakeClaude registra base-url y api-key).
ai:
  max-retries: 0
  timeout: 2s
  invalid-output-retries: 1

resilience4j:
  circuitbreaker:
    instances:
      anthropic:
        # Que las pruebas de errores no abran el circuito para las demás.
        minimum-number-of-calls: 100000
  ratelimiter:
    instances:
      anthropic:
        limit-for-period: 100000

logging:
  level:
    root: WARN
    co.edu.retencion: INFO
    # Fallos de listeners de eventos (Modulith los registra en INFO y deja la publicación pendiente).
    org.springframework.modulith.events: INFO
