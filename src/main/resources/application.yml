# =====================================================================================
# Configuración común a todos los perfiles. Valores sensibles SOLO por variables de entorno
# (ver .env.example). Perfiles: dev (local), test (pruebas), prod (Render / nube).
# Asistido por IA (Claude, Anthropic). Ver BITACORA_IA.md.
# =====================================================================================
spring:
  application:
    name: retencion-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:retencion}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_APP_USER:retencion_app}
    password: ${DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # Hikari recibe milisegundos.
      connection-timeout: 10000
      max-lifetime: 1800000
      pool-name: retencion-pool
  flyway:
    # Flyway migra con un usuario dueño del esquema; la app usa un rol con menos privilegios.
    user: ${DB_MIGRATION_USER:${DB_APP_USER:retencion_app}}
    password: ${DB_MIGRATION_PASSWORD:${DB_APP_PASSWORD:}}
    placeholders:
      appDbRole: ${DB_APP_ROLE:retencion_app}
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        timezone:
          default_storage: NORMALIZE_UTC
        order_inserts: true
        order_updates: true
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Las importaciones masivas admiten hasta 20 MB (las evidencias tienen su propio límite).
      max-file-size: 20MB
      max-request-size: 21MB
  modulith:
    events:
      # Las publicaciones completadas se borran para que el outbox no crezca sin límite.
      completion-mode: delete
      republish-outstanding-events-on-restart: true
      externalization:
        # Publicación de eventos @Externalized en RabbitMQ (opcional).
        enabled: ${APP_RABBIT_ENABLED:false}
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:amqp://guest:guest@localhost:5672}
  batch:
    job:
      # El lote nocturno de riesgo lo lanza RiskBatchLauncher (cron), no el arranque.
      enabled: false
    jdbc:
      # Las tablas BATCH_* las crea Flyway (V4).
      initialize-schema: never

server:
  port: ${PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    max-swallow-size: 21MB
    max-http-form-post-size: 64KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: ADMIN
  health:
    rabbit:
      enabled: ${APP_RABBIT_ENABLED:false}
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: retencion-backend
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:false}
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

resilience4j:
  circuitbreaker:
    instances:
      supabase:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        record-failure-predicate: co.edu.retencion.auth.infrastructure.supabase.SupabaseFailurePredicate
      # API de Claude: si falla de forma repetida se deja de llamar y todo cae al motor de reglas.
      anthropic:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
  ratelimiter:
    instances:
      anthropic:
        limit-for-period: ${AI_CALLS_PER_MINUTE:60}
        limit-refresh-period: 1m
        timeout-duration: 5s
  bulkhead:
    instances:
      anthropic:
        max-concurrent-calls: ${AI_MAX_CONCURRENT_CALLS:8}
        max-wait-duration: 2s

# Integración con Claude (SDK oficial de Anthropic). Sin ANTHROPIC_API_KEY todo se resuelve con el
# motor de reglas. Los interruptores de privacidad y el presupuesto de tokens están en app_settings
# (ai.enabled, ai.free-text.enabled, ai.payload.include-sensitive-signals, ai.daily-token-budget...).
ai:
  api-key: ${ANTHROPIC_API_KEY:}
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  model:
    # Modelo capaz para casos críticos y retención; modelo económico para análisis masivo.
    default: ${AI_MODEL_DEFAULT:claude-opus-5-5}
    triage: ${AI_MODEL_TRIAGE:claude-haiku-5-5}
  effort:
    default: ${AI_EFFORT_DEFAULT:medium}
    triage: ${AI_EFFORT_TRIAGE:low}
  max-tokens: 16000
  timeout: ${AI_TIMEOUT:60s}
  max-retries: 2
  invalid-output-retries: 1
  refusal-fallback: true
  agent-max-iterations: 6

app:
  http:
    trusted-proxy-hops: ${APP_TRUSTED_PROXY_HOPS:0}
    client-ip-header: ${APP_CLIENT_IP_HEADER:}
  security:
    jwt:
      issuer: ${APP_JWT_ISSUER:retencion-backend}
      audience: ${APP_JWT_AUDIENCE:retencion-api}
      secret: ${APP_JWT_SECRET:}
      access-token-ttl: ${APP_JWT_ACCESS_TTL:15m}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    per-ip:
      capacity: ${APP_RATE_LIMIT_IP_CAPACITY:300}
      period: 1m
    per-user:
      capacity: ${APP_RATE_LIMIT_USER_CAPACITY:600}
      period: 1m
    sensitive:
      capacity: ${APP_RATE_LIMIT_AUTH_CAPACITY:20}
      period: 1m
    sensitive-paths: /api/v1/auth/
  state:
    backend: ${APP_STATE_BACKEND:memory}
    redis-url: ${REDIS_URL:}
  crypto:
    kms-type: ${APP_KMS_TYPE:local}
    blind-index-key: ${APP_CRYPTO_BLIND_INDEX_KEY:}
    local:
      active-key-id: ${APP_CRYPTO_ACTIVE_KEY_ID:local-v1}
      master-key: ${APP_CRYPTO_MASTER_KEY:}
      previous-keys: ${APP_CRYPTO_PREVIOUS_KEYS:}
    vault:
      uri: ${VAULT_URI:}
      token: ${VAULT_TOKEN:}
      key-name: ${VAULT_TRANSIT_KEY:retencion-pii}
  audit:
    partition-months-ahead: 3
  settings:
    cache-ttl: 30s
  imports:
    max-file-size: 20MB
    # Hasta este tamaño se procesa en la misma petición; los más grandes quedan en cola.
    sync-max-size: 256KB
    poll-interval-ms: 2000
    stale-after: 30m
    # Alias extra de encabezados por campo (mapeo configurable de los datos reales), p. ej.:
    # aliases:
    #   documento: [num_identificacion, doc_estudiante]
  synthetic:
    enabled: false
    students: 50000
  users:
    bootstrap-admin-emails: ${APP_BOOTSTRAP_ADMIN_EMAILS:}
    default-roles: ${APP_DEFAULT_ROLES_BY_DOMAIN:}
  auth:
    # Vacío = se acepta cualquier dominio de correo.
    allowed-email-domains: ${APP_ALLOWED_EMAIL_DOMAINS:}
    refresh-token-ttl: ${APP_REFRESH_TTL:8h}
    session-max-lifetime: ${APP_SESSION_MAX_LIFETIME:24h}
    supabase:
      url: ${SUPABASE_URL:}
      anon-key: ${SUPABASE_ANON_KEY:}
      jwt-secret: ${SUPABASE_JWT_SECRET:}
      require-verified-email: ${APP_REQUIRE_VERIFIED_EMAIL:true}
    break-glass:
      enabled: ${BREAK_GLASS_ENABLED:false}
      username: ${BREAK_GLASS_USERNAME:}
      password-hash: ${BREAK_GLASS_PASSWORD_HASH:}
      totp-secret: ${BREAK_GLASS_TOTP_SECRET:}
  rabbit:
    enabled: ${APP_RABBIT_ENABLED:false}
  storage:
    # local (dev/test) o s3 (MinIO, Supabase Storage, Cloudflare R2, AWS S3...).
    type: ${APP_STORAGE_TYPE:local}
    local:
      directory: ${APP_STORAGE_LOCAL_DIR:}
      public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:retencion}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      create-bucket: ${S3_CREATE_BUCKET:false}
  antivirus:
    # clamav (producción) o signature (solo detecta EICAR: dev/test).
    mode: ${APP_ANTIVIRUS_MODE:clamav}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    timeout: 20s
  justifications:
    max-evidence-size: ${APP_EVIDENCE_MAX_SIZE:5MB}
    max-evidences-per-request: 5
    download-url-ttl: 5m
  realtime:
    # simple (una instancia: dev/pruebas/Render) o relay (RabbitMQ con plugin rabbitmq_stomp, varias instancias)
    broker: ${APP_REALTIME_BROKER:simple}
    relay-host: ${APP_REALTIME_RELAY_HOST:localhost}
    relay-port: ${APP_REALTIME_RELAY_PORT:61613}
    relay-login: ${APP_REALTIME_RELAY_LOGIN:guest}
    relay-passcode: ${APP_REALTIME_RELAY_PASSCODE:guest}
    message-size-limit: 64KB
    heartbeat: 10s
    send-capacity: ${APP_REALTIME_SEND_PER_MINUTE:60}
    send-period: 1m
  analytics:
    # Refresca las vistas de analítica cuando hay cambios (y siempre, una vez por noche).
    refresh-enabled: ${APP_ANALYTICS_REFRESH_ENABLED:true}
    refresh-check-ms: 30000
  reports:
    worker-enabled: ${APP_REPORTS_WORKER_ENABLED:true}
    poll-interval-ms: 5000
  risk:
    # Procesa la cola del motor (reanálisis por eventos y planes de apoyo).
    worker-enabled: ${APP_RISK_WORKER_ENABLED:true}
    worker-interval-ms: 15000
    batch:
      enabled: ${APP_RISK_BATCH_ENABLED:true}
      # 01:30 hora de Bogotá.
      cron: ${APP_RISK_BATCH_CRON:0 30 1 * * *}
      concurrency: 3
      chunk-size: 20
      page-size: 200
  mail:
    # logging (dev: no envía), graph (Microsoft Graph), resend, memory (tests).
    provider: ${APP_MAIL_PROVIDER:logging}
    dispatch-enabled: ${APP_MAIL_DISPATCH_ENABLED:true}
    from: ${APP_MAIL_FROM:}
    portal-url: ${APP_PORTAL_URL:http://localhost:3000}
    webhook-secret: ${APP_MAIL_WEBHOOK_SECRET:}
    max-attempts: 8
    backoff-base: 1m
    backoff-max: 6h
    graph:
      tenant-id: ${APP_MAIL_GRAPH_TENANT_ID:}
      client-id: ${APP_MAIL_GRAPH_CLIENT_ID:}
      client-secret: ${APP_MAIL_GRAPH_CLIENT_SECRET:}
      mailbox: ${APP_MAIL_GRAPH_MAILBOX:}
    resend:
      api-key: ${APP_MAIL_RESEND_API_KEY:}
